{% extends "base.html" %}

{% block title %}作業列表｜作業管理系統{% endblock %}

{% block content %}
<h1>作業管理系統</h1>

<p>作業依截止日期由早到晚排列。</p>

<a class="button" href="{{ url_for('create_page') }}">
    新增作業
</a>

<p id="list-message" role="status">正在載入作業……</p>

<div id="assignment-list" class="table-wrap" hidden>
    <table>
        <thead>
            <tr>
                <th scope="col">課程名稱</th>
                <th scope="col">作業名稱</th>
                <th scope="col">截止日期</th>
            </tr>
        </thead>

        <tbody id="assignment-rows"></tbody>
    </table>
</div>
{% endblock %}
