{% extends "base.html" %}

{% block title %}{{ page_title }}｜作業管理系統{% endblock %}

{% block content %}
<h1>{{ page_title }}</h1>

<p>三個欄位皆為必填。</p>
<p id="form-error" class="error" role="alert"></p>

<form
    id="assignment-form"
    data-id="{{ assignment.id if assignment else '' }}"
>
    <label for="course">課程名稱</label>
    <input
        type="text"
        id="course"
        name="course"
        maxlength="100"
        value="{{ assignment.course if assignment else '' }}"
        required
    >

    <label for="task">作業名稱</label>
    <input
        type="text"
        id="task"
        name="task"
        maxlength="200"
        value="{{ assignment.task if assignment else '' }}"
        required
    >

    <label for="deadline">截止日期</label>
    <input
        type="date"
        id="deadline"
        name="deadline"
        value="{{ assignment.deadline.isoformat() if assignment else '' }}"
        required
    >

    <div class="actions">
        <button type="submit">儲存作業</button>

        {% if assignment %}
        <a
            class="button secondary"
            href="{{ url_for(
                'detail_page',
                assignment_id=assignment.id
            ) }}"
        >
            取消
        </a>
        {% else %}
        <a
            class="button secondary"
            href="{{ url_for('index') }}"
        >
            回到作業列表
        </a>
        {% endif %}
    </div>
</form>
{% endblock %}
