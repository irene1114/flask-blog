
{% extends "base.html" %}

{% block title %}{{ post['title'] }} - 我的部落格{% endblock %}

{% block content %}
<h1>{{ post['title'] }}</h1>
<p class="meta">作者：{{ post['author'] }}</p>
<hr>
<div class="content">{{ post['content'] }}</div>

<p>
    <a class="button"
       href="{{ url_for('edit_post', post_id=post['id']) }}">
        編輯文章
    </a>
</p>

<form method="POST"
      action="{{ url_for('delete_post', post_id=post['id']) }}"
      onsubmit="return confirm('確定要刪除這篇文章嗎？');">
    <button class="danger" type="submit">刪除文章</button>
</form>

<p><a href="{{ url_for('index') }}">返回首頁</a></p>
{% endblock %}
