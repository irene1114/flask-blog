<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>
        {% block title %}作業管理系統{% endblock %}
    </title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f4f6fa;
            color: #243247;
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            line-height: 1.7;
        }

        main {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        nav {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            padding: 28px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px #0000000d;
        }

        h1 {
            margin-top: 0;
            overflow-wrap: anywhere;
        }

        a {
            color: #255bc7;
        }

        button, .button {
            display: inline-block;
            padding: 9px 16px;
            border: 0;
            border-radius: 6px;
            background: #255bc7;
            color: white;
            font: inherit;
            text-decoration: none;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .danger {
            background: #b42332;
        }

        .secondary {
            background: #64748b;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 24px;
        }

        .table-wrap {
            margin-top: 20px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
            overflow-wrap: anywhere;
        }

        th {
            background: #eef3fc;
        }

        label {
            display: block;
            margin-top: 16px;
            font-weight: bold;
        }

        input {
            width: 100%;
            margin-top: 6px;
            padding: 10px;
            border: 1px solid #b8c4d6;
            border-radius: 6px;
            font: inherit;
        }

        .error {
            color: #b42332;
        }

        dd {
            margin: 0 0 16px;
            overflow-wrap: anywhere;
        }

        dt {
            font-weight: bold;
        }
    </style>

    <script
        src="{{ url_for('static', filename='js/main.js') }}"
        defer
    ></script>
</head>

<body>
    <main>
        <nav aria-label="主要導覽">
            <a href="{{ url_for('index') }}">作業列表</a>
            <a href="{{ url_for('create_page') }}">新增作業</a>
        </nav>

        <section class="card">
            {% block content %}{% endblock %}
        </section>
    </main>
</body>
</html>
